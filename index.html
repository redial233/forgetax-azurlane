function basePart(w,lv){lv=lv??w.lv;const b=BASE*(w.line?2:1)+w.baseAdd+(has('charcoal_pouch')?80:0)+(has('pocket_hearth')?20*S.paid:0);return b*Math.pow(1.5,lv)*w.gmul}

function deck(w,fr){const sk=has('sickle_and_hammer');let t=sk?{B:5,D:5,H:5,S:5,G:5}:{B:9,D:2,H:5,S:12,G:2};
  const add=(k,n)=>t[k]=Math.max(0,t[k]+n),mv=(a,b,n)=>{const x=Math.min(n,t[a]);t[a]-=x;t[b]+=x};
  if(has('bent_nail'))add('S',4);if(has('royal_spike'))add('S',6);if(has('lucky_coal'))add('G',1);if(has('golden_nail'))add('G',2);if(has('oracle_die'))add('G',4);
  if(has('patient_weight'))add('H',3);if(has('sealing_stone'))add('H',2);if(has('eternal_seed'))add('H',6);if(has('abyssal_pearl'))add('D',3);
  if(has('iron_hoop'))add('B',-2);if(has('butterfingers')){add('B',3);add('G',5)}
  if(has('worn_whetstone'))mv('H','S',2);if(has('blunt_mallet'))mv('D','S',1);if(has('thorn_weight'))mv('H','D',2);
  if(has('obsidian_eye')&&w.lv>=8)mv('S','G',2);
  if(fr&&has('perfect_mana_core'))add('G',6);
  add('S',w.xS+w.nextS);add('G',w.xG+w.nextG+S.grudge);
  for(const k in S.runT)add(k,S.runT[k]);
  if(has('mourning_knot'))add('G',S.fails);
  if(S.armed.chalk)t.G*=2;
  return t}
function breakMul(w){let m=1;if(has('black_knot'))m*=.9;if(has('dragonscale_tongs')&&w.lv>=6)m*=.75;if(w.scorch)m*=1-.03*w.scorch;if(w.splice)m*=1-.15*w.splice;m*=w.nextBk;return m}
function probs(w,fr){const t=deck(w,fr);const c=curve(w.lv);const bw=c>=1?1e9:(21*c/(1-c))*t.B/9;
  let tot=bw+t.D+t.H+t.S+t.G;let p={B:bw/tot,D:t.D/tot,H:t.H/tot,S:t.S/tot,G:t.G/tot};
  if(fr)p.B=0;else{p.B*=breakMul(w)}
  const rest=p.D+p.H+p.S+p.G,share=1-p.B;if(rest>0)for(const k of'DHSG')p[k]=p[k]/rest*share;
  if(S.armed.powder&&!fr){p={B:p.B+p.D+p.H,D:0,H:0,S:0,G:p.S+p.G}}
  // 取整到 1000 张签
  const ks='BDHSG',raw=ks.split('').map(k=>p[k]*1000),fl=raw.map(Math.floor);let left=1000-fl.reduce((a,b)=>a+b,0);
  raw.map((x,i)=>[x-fl[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([_,i])=>{if(left>0){fl[i]++;left--}});
  const o={};ks.split('').forEach((k,i)=>o[k]=fl[i]/1000);return o}

  const t=now();let fr=inFr(w);if(t-lastStrikeAt<CD/speed(fr)-20)return;lastStrikeAt=t;procs=[];

  if(w&&!w.scrap){const o=probs(w,fr||w.ch>=CHMAX);
    h+=`<div class="cur">${gearSVG(w)}<div style="flex:1;font-size:13px"><b>${formName(w)}</b> <span style="color:#ffd77a;font-size:20px;font-weight:800">+${w.lv}</span>${famOf(w)?'<span class="tag">'+FAM[famOf(w)][0]+'</span>':''}<br>价值 <b style="color:#ffd77a">${valOf(w).toLocaleString()}</b>${w.hot?'':' · <b style="color:#ff8a3d">需先加热</b>'}${w.ch>=CHMAX&&!fr?'<br><b style="color:#ff7ad9">狂热已充满：下一锤开始狂热！</b>':''}</div></div>
    <div class="odds">${'GSHDB'.split('').map(k=>o[k]>0?`<div style="width:${o[k]*100}%;background:${COL[k]}">${o[k]>.07?(o[k]*100).toFixed(1)+'%':''}</div>`:'').join('')}</div>
    <div class="legend">${'GSHDB'.split('').map(k=>`<span><i style="background:${COL[k]}"></i>${NM[k]} ${(o[k]*100).toFixed(1)}%</span>`).join('')}</div>
    ${fr?`<div class="frbar"><div style="width:100%"></div></div>`:`<div class="charge">${Array.from({length:CHMAX},(_,i)=>`<i class="${i<w.ch?'on':''}"></i>`).join('')}</div>`}
    <div class="procs">${procs.join(' · ')}</div>
    <div class="row">${w.hot?`<button class="btn ${fr?'pink':'gold'} big" onpointerdown="strike();event.preventDefault()">🔨 ${fr?'狂热连打！':'强化'}</button>`:`<button class="btn red big" onclick="heat()" ${heating?'disabled':''}>🔥 ${heating?'加热中…':'加热'}</button>`}</div>
    <div class="row" style="margin-top:6px">${['scale','clock','chalk','powder','shard'].map(k=>`<button class="btn ${S.armed[k]?'armed':''}" style="font-size:11px;padding:6px 2px" onclick="useItem('${k}')" ${S.cons[k]||S.armed[k]?'':'disabled'}>${ITEMS[k][0]}<br>×${S.cons[k]}</button>`).join('')}</div>
    <div class="row" style="margin-top:6px"><button class="btn" onclick="toggleTr(${w.id})">${w.tr?'取消上缴':'放入征收窗口'}</button><button class="btn" onclick="feed(${w.id})">投入装备箱</button><button class="btn" onclick="S.sel=-1;S.fr=null;undoSnap=null;render()">放下</button></div>`;
  }else h+=`<div style="text-align:center;padding:12px;opacity:.85">${undoSnap&&S.cons.clock?`<button class="btn gold" onclick="undo()">⏪ 用回溯怀表救回刚碎的舰装</button><br><br>`:''}点击下方仓库里的舰装放上工作台</div>`;
  h+=`</div><h3>仓库（${S.inv.length}）</h3><div class="cards">`+S.inv.map(x=>`<div class="card ${x.id===S.sel?'sel':''} ${x.tr?'tr':''}" onclick="pick(${x.id})">${x.hot&&!x.scrap?'<span class="hot">🔥</span>':''}<div class="lv">${x.scrap?'残骸':'+'+x.lv}</div>${formName(x)}<br><b>${valOf(x).toLocaleString()}</b>${x.ch&&!x.scrap?`<br><small>⚡${x.ch}/10</small>`:''}<span class="tg" onclick="event.stopPropagation();toggleTr(${x.id})">${x.tr?'📦 待上缴':'放入窗口'}</span></div>`).join('')+`</div>
  <div class="tabs">${[['shop','装备箱'],['merch','明石商店'+(S.merch?'':'🔒')],['shelf','设备架 '+S.relics.length+'/8'],['codex','图鉴/成就'],['cal','日历']].map(([k,n])=>`<button class="btn ${S.tab==k?'on':''}" onclick="tab('${k}')">${n}</button>`).join('')}</div><div class="panel">${panel()}</div>
  <div style="text-align:center;margin-top:10px"><button class="btn" onclick="help()">📖 说明</button> <button class="btn" onclick="if(confirm('放弃当前进度重新开始？'))newRun()">重新开始</button></div>
  <div class="foot"><div class="in"><button class="btn red big" style="width:100%" onclick="bell()">🔔 敲钟结束今天（${tv.toLocaleString()} / ${q.toLocaleString()}）</button></div></div>`;
  $('#app').innerHTML=h}
function rel(k,btn){const r=R[k];return `<div class="relic r${r[2]}"><div style="flex:1"><b>${r[0]}</b><span class="tag">${['普通','稀有','传说'][r[2]]}${r[5]=='m'?'·杰作':r[5]=='a'?'·成就':''}</span><br>${r[1]}</div>${btn||''}</div>`}
function panel(){
  if(S.tab=='shop'){if(S.gift)return `<small>第一天：从 3 个初始设备中免费选 1 个（不能刷新）</small>`+S.shop.map((r,i)=>rel(r.k,`<button class="btn gold" onclick="buyRelic(${i})">免费</button>`)).join('');
    if(!S.shop.length&&S.day==1)return '<small>明天装备箱正式营业</small>';
    return `<small>任何舰装投入装备箱都只换 1 张物资券。今日概率 普通/稀有/传说 = ${shopOdds(S.day).join('/')}</small>`+S.shop.map((r,i)=>rel(r.k,r.sold?'<small>已兑换</small>':`<button class="btn gold" onclick="buyRelic(${i})">${r.c} 券</button>`)).join('')+
    `<button class="btn" style="width:100%" onclick="reroll()">🔄 刷新（${has('worn_voucher')&&!S.freeRr?'免费':rerollCost().toLocaleString()+' 资金'}）</button>`}
  if(S.tab=='merch'){if(!S.merch)return `<small>明石每 3 天来一次（第 3、6、9…天），今天不在喵~ 下次：第 ${Math.ceil((S.day+1)/3)*3} 天</small>`;
    return '<small>用资金购买；同一商品每多买一件价格 ×3</small>'+S.merch.map((it,i)=>`<div class="relic"><div style="flex:1"><b>${it.name}</b> <small>剩 ${it.stock-it.bought}</small><br>${ITEMS[it.k]?ITEMS[it.k][1]:it.k=='special'?'商人专属系列，基础价值是普通舰装的 2 倍，每 2 级换一种外形':'普通的 +0 舰装'}</div>${it.bought>=it.stock?'<small>售罄</small>':`<button class="btn gold" onclick="buyM(${i})">${(it.p*Math.pow(3,it.bought)).toLocaleString()}</button>`}</div>`).join('')}
  if(S.tab=='shelf')return (S.relics.length?S.relics.map(k=>rel(k,`<button class="btn" onclick="drop('${k}')">丢弃</button>`)).join(''):'<small>还没有设备</small>')+
    `<small>本局：缴足 ${S.paid} 次 · 失败 ${S.fails} 次 · 打碎 ${S.broken} 件 · 狂热 ${S.frenzies} 次${S.grudge?' · 怨念大成功签 '+S.grudge:''}${Object.values(S.runT).some(x=>x)?' · 永久签 '+Object.entries(S.runT).filter(e=>e[1]).map(e=>NM[e[0]]+'+'+e[1]).join(' '):''}</small>`;
  if(S.tab=='codex'){let h='<b>成就</b>（跨局保留，解锁的设备会加入以后的装备箱）';for(const k in ACH)h+=`<div class="relic"><div style="flex:1"><b>${M.ach[k]?'🏆 ':'🔒 '}${ACH[k][0]}</b><br>${ACH[k][1]}</div></div>`;
    h+='<b>舰装图鉴</b>';for(const f in FAM){const m=M.forms[f]??-1;const forms=FAM[f].slice(1);const lv0=MERCH_LINES.includes(f)?0:10,stp=2;
      h+=`<div class="relic"><div><b>${FAM[f][0]}</b> <small>最高 +${m<0?'—':m}</small><br>${forms.map((n,i)=>m>=lv0+i*stp?n:'???').join(' → ')}</div></div>`}
    return h+`<small>累计 ${M.runs} 局，历史最高单件 ${M.best.toLocaleString()}</small>`}
  if(S.tab=='cal'){let h='<div class="cal">';for(let d=1;d<=Math.max(21,S.day+3);d++)h+=`<div class="${d==S.day?'now':''} ${isMerchDay(d)?'mer':''} ${d<S.day?'past':''}">${d}<br>${quotaOf(d)>=1e4?Math.round(quotaOf(d)/1000)+'k':quotaOf(d)}</div>`;
    return h+'</div><small>绿框 = 明石来访日。第 21 天之后为延长期，征收每天 +20%。</small>'}
}
function tab(t){S.tab=t;render()}
function pick(id){if(S.fr&&S.fr.id!==id)S.fr=null;S.sel=S.sel===id?-1:id;undoSnap=null;procs=[];snd('hold');render()}
function toggleTr(id){const w=S.inv.find(x=>x.id===id);w.tr=!w.tr;snd('hold');save();render()}
function modal(t,body,btn,cb){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="box"><h2>${t}</h2>${body}<br><br><button class="btn gold" style="width:100%">${btn}</button></div>`;document.body.appendChild(m);m.querySelector('button').onclick=()=>{m.remove();cb&&cb()}}
function help(){modal('港区锻造税 · 玩法说明',`塞壬占领了港区工坊，每天傍晚征收"锻造税"。撑过 <b>21</b> 天即完成契约；缴不够让塞壬<b>怒气 +1</b>，第 3 次就会失败。
<br><br><b>① 加热</b>：每天早上送来 3 件舰装。点选后先加热一次（之后不会冷却）。
<br><b>② 强化</b>：每锤从 1000 张签里抽一张：<span style="color:#d0359f">大成功 +2 级且价值×2.5</span>、<span style="color:#1f9a63">成功 +1</span>、维持、<span style="color:#c27a10">受损 -1</span>、<span style="color:#c3203a">破碎（舰装消失）</span>。+0 不会碎，+4→24.8%，+10→46.7%，+30 起 72%。每级价值 ×1.5（+0=320，+5=2,430，+10=18,453）。概率条永远显示下一锤的准确概率。
<br><b>③ 狂热</b>：同一件舰装敲满 10 格，下一锤开始 <b>4 秒狂热</b>：期间绝不破碎，抓紧连点（每锤间隔 0.64 秒）。
<br><b>④ 上缴</b>：把舰装放入征收窗口，只看总价值。敲钟结束这一天。无论是否缴够，上缴的价值全部返还为资金。没上缴的舰装会留到第二天。
<br><b>⑤ 装备箱</b>：任何舰装投入都只换 1 张物资券。第 1 天免费选 1 个初始设备；之后每天 3 个设备，可用资金刷新。设备架最多 8 个。
<br><b>⑥ 明石商店</b>：第 3、6、9…天来访，卖舰装、专属系列舰装和消耗品（损管套件、回溯怀表等）。
<br><b>⑦ 成就与杰作</b>：把某系列舰装锻到 +20、完成契约等会解锁新设备，以后的局里会出现。
<br><br><small>玩法与数值致敬 Steam 游戏《ForgeTax》（GraveYardDev），依据其 10 月 12 日版本的公开资料复刻。美术、名称和文本均为碧蓝航线风原创同人，非官方作品。</small>`,'明白了！')}
load();render();if(!localStorage.getItem('ftal_seen')){localStorage.setItem('ftal_seen',1);help()}
</script></body></html>
