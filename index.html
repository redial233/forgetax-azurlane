function deck(w,fr,L){const sk=has('sickle_and_hammer');let t=sk?{B:5,D:5,H:5,S:5,G:5}:{B:9,D:2,H:5,S:12,G:2};
  if(L)L.push([sk?'基础签池（镰刀与锤子：每种 5 张）':'基础签池',{...t}]);
  const add=(k,n,why)=>{if(!n)return;const b=t[k];t[k]=Math.max(0,t[k]+n);if(L&&t[k]!==b)L.push([why,{[k]:t[k]-b}])},
        mv=(a,b,n,why)=>{const x=Math.min(n,t[a]);t[a]-=x;t[b]+=x;if(L&&x)L.push([why,{[a]:-x,[b]:x}])},
        hr=(k,pile,n)=>{if(has(k))add(pile,n,R[k][0])};
  hr('bent_nail','S',4);hr('royal_spike','S',6);hr('lucky_coal','G',1);hr('golden_nail','G',2);hr('oracle_die','G',4);
  hr('patient_weight','H',3);hr('sealing_stone','H',2);hr('eternal_seed','H',6);hr('abyssal_pearl','D',3);
  hr('iron_hoop','B',-2);if(has('butterfingers')){add('B',3,R.butterfingers[0]);add('G',5,R.butterfingers[0])}
  if(has('worn_whetstone'))mv('H','S',2,R.worn_whetstone[0]);if(has('blunt_mallet'))mv('D','S',1,R.blunt_mallet[0]);if(has('thorn_weight'))mv('H','D',2,R.thorn_weight[0]);
  if(has('obsidian_eye')&&w.lv>=8)mv('S','G',2,R.obsidian_eye[0]+'（+8 以上）');
  if(fr&&has('perfect_mana_core'))add('G',6,R.perfect_mana_core[0]+'（狂热中）');
  add('S',w.xS,'本舰装累计的成功签');add('G',w.xG,'本舰装累计的大成功签');
  add('S',w.nextS,'仅下一锤：成功签');add('G',w.nextG,'仅下一锤：大成功签');add('G',S.grudge,R.grudge_nail[0]+'储存的一次性签');
  const nm={B:'破碎',D:'受损',H:'维持',S:'成功',G:'大成功'};for(const k in S.runT)add(k,S.runT[k],'本局永久'+nm[k]+'签');
  if(has('mourning_knot'))add('G',S.fails,R.mourning_knot[0]+'（失败次数）');
  if(S.armed.chalk){const x=t.G;t.G*=2;if(L&&x)L.push(['幸运粉笔（大成功翻倍）',{G:x}])}
  return t}
function breakMul(w){let m=1;if(has('black_knot'))m*=.9;if(has('dragonscale_tongs')&&w.lv>=6)m*=.75;if(w.scorch)m*=1-.03*w.scorch;if(w.splice)m*=1-.15*w.splice;m*=w.nextBk;return m}
function probs(w,fr){const t=deck(w,fr);const c=curve(w.lv);const bw=c>=1?1e9:(21*c/(1-c))*t.B/9;
  let tot=bw+t.D+t.H+t.S+t.G;let p={B:bw/tot,D:t.D/tot,H:t.H/tot,S:t.S/tot,G:t.G/tot};
  if(fr)p.B=0;else{p.B*=breakMul(w)}
  const rest=p.D+p.H+p.S+p.G,share=1-p.B;if(rest>0)for(const k of'DHSG')p[k]=p[k]/rest*share;
  if(S.armed.powder&&!fr){p={B:p.B+p.D+p.H,D:0,H:0,S:0,G:p.S+p.G}}
  // 取整到 1000 张签
  const ks='BDHSG',raw=ks.split('').map(k=>p[k]*1000),fl=raw.map(Math.floor);let left=1000-fl.reduce((a,b)=>a+b,0);
  raw.map((x,i)=>[x-fl[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([_,i])=>{if(left>0){fl[i]++;left--}});
  const o={};ks.split('').forEach((k,i)=>o[k]=fl[i]/1000);return o}

let lastStrikeAt=0,undoSnap=null,procs=[];
function speed(fr){let s=1;if(has('worn_grip'))s+=.15;if(fr&&has('possessed_bellows'))s+=.3;if(!fr&&has('leather_loop'))s+=.2;return s}
function frDur(){return 4000+(has('red_hourglass')?1000:0)+(has('undying_wick')?2000:0)}

function gainLv(w,n,why){if(n<=0)return;w.lv=Math.min(MAXLV,w.lv+n);if(w.lv>w.peak)w.peak=w.lv;if(why)procs.push(why+' +'+n+'级')}

  undoSnap={sw:JSON.parse(JSON.stringify(w)),idx:S.inv.indexOf(w),grudge:S.grudge,runT:{...S.runT},gold:S.gold,inherit:{...S.inherit},molar:S.molar,ledgerNext:S.ledgerNext,broken:S.broken,inv:S.inv.length,wire:S.wireUsed};

    }else{gainLv(w,1);if(w.holdS){gainLv(w,w.holdS,'小风铃');w.holdS=0}
      if(has('bronze_cog'))w.xS++;if(has('golden_cog'))w.baseAdd+=30;

    if(has('red_thread'))w.nextBk*=.8;if(has('closed_third_eye'))w.nextS+=4;if(has('blind_die'))w.nextG+=3;
    w.streakH++;if(w.streakH%2==0&&has('sealing_stone'))gainLv(w,1,'封印之石');
    w.streakSG=0;
  }else if(res=='D'){
    const spineD=w._spineD;delete w._spineD;
    const before=basePart(w);let drop=true;

    if(drop&&w.lv>0){w.lv--;const lost=before-basePart(w);if(has('cracked_crown'))w.flat+=lost*.5}
    if(has('iron_comb'))w.flat+=before*.05;
    if(has('patched_apron')){w.flat+=140;bonusFn=()=>{w.flat+=140}}
    if(has('cracked_splice')&&w.splice<4)w.splice++;
    if(has('defeated_kings_seal'))w.dmgG++;
    if(has('unbroken_oath')&&Math.random()<.7)gainLv(w,1,'不灭誓约');
    if(!fr&&has('cracked_wristwatch')&&w.ch<CHMAX){w.ch++;procs.push('裂开的怀表 +1充能')}
    if(has('blind_die'))w.nextG+=3;
    if(has('giants_spine')&&!spineD){w.spineCnt++;if(w.spineCnt%2==0){w.spine=1;procs.push('巨人脊骨储存了 1 次保护')}}
    w.afterDmg=1;w.streakSG=0;w.streakH=0;
  }
  if(fr&&has('bell_collar')){w.mul*=1.05;bonusFn=bonusFn||(()=>{w.mul*=1.05})}
  if(has('soot_censer')&&prevLast&&prevLast!==res)w.baseAdd+=20;
  if(prevLast===res){w.streakSame++;if(w.streakSame%2==1){if(has('wax_effigy')){w.flat+=150;procs.push('蜡像 +150')}if(has('split_twin_mirror')&&w.lastBonus){w.lastBonus();procs.push('双生裂镜：重复加成')}}}else w.streakSame=0;
  if(bonusFn)w.lastBonus=bonusFn;
  if(has('bound_idol')){const tier=Math.floor(w.lv/4);while(w.idol<tier){w.idol++;w.mul*=1.15;procs.push('被缚的神像 +15%')}}
  w.last=res;
  // 狂热充能
  if(!fr){let c=1;if(firstNormal&&has('ember_locket'))c+=2;w.ch=Math.min(CHMAX,w.ch+c)}
  w.first=0;
  if(has('seal_of_twins')&&Math.random()<.02){const c=JSON.parse(JSON.stringify(w));c.id=S.uid++;c.tr=false;S.inv.push(c);procs.push('双子之印：复制了一件！')}
  const nm={G:['大成功','#ff7ad9','great'],S:['成功','#43c98b','ok'],H:['维持','#bfe6ff','hold'],D:['受损','#f0a33a','dmg']}[res];
  snd('hit');snd(nm[2]);fx(nm[0]+(res=='G'?'！':''),nm[1]);
  if(res=='G'){react('joy');say(pick1(['哇！闪闪发光的！','大、大成功！嘿嘿~','珍珠号一定会喜欢的！']))}
  else if(res=='S')say(pick1(['很顺利呢。','再来一下？……还是见好就收？','手感不错哦，指挥官。']));
  else if(res=='H')say('没有变化……');else{react('sad');say('呜，敲歪了一点……')}
  postStrike(w);

function postStrike(w){S.maxv=Math.max(S.maxv,valOf(w));S.maxlv=Math.max(S.maxlv,w.lv);if(w.lv>=10)award('FIRST10');
  const f=famOf(w);if(f){M.forms[f]=Math.max(M.forms[f]||0,w.peak);if(w.peak>=20)award('M_'+f)}
  M.best=Math.max(M.best,S.maxv);saveMeta();save();render()}
function doBreak(w,fr){S.broken++;if(S.broken>=10)award('BROKEN10');snd('brk');fx('破碎！','#e8445a');react('sad');
  document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),300);

  if(has('undertakers_chalice')){const s=newSword();s.scrap=Math.round(peakV*.3);s.tr=true;S.inv.push(s);procs.push('残骸 '+s.scrap+' 已放入上缴窗口')}

  if(rate&&w.lv>0){S.inherit.lv+=Math.floor(w.lv*rate);S.inherit.ch+=(has('broken_holy_sword')?3:0)+(has('dawn_scabbard')?4:0);procs.push('传承：下一件 +0 舰装将继承')}

  S.inv=S.inv.filter(x=>x!==w);S.broken_pending=w.id;say(msg);applyInherit();

function applyInherit(){if(!S.inherit.lv&&!S.inherit.ch&&!S.molar)return;const t=S.inv.find(x=>!x.scrap&&!x.line&&x.lv==0&&x.n==0&&x.id!==S.sel);if(!t)return;

function rollShop(){const o=shopOdds(S.day),out=[];
  for(let i=0;i<3;i++){let x=Math.random()*100,rar=x<o[0]?0:x<o[0]+o[1]?1:2;let pool=poolFor(rar).filter(k=>!out.some(z=>z.k==k));
    for(let d=rar;!pool.length&&d>=0;d--)pool=poolFor(d).filter(k=>!out.some(z=>z.k==k));if(!pool.length)continue;
    const wts=pool.map(k=>RECOVERY.includes(k)&&S.day<=6?2.5:1);let s=Math.random()*wts.reduce((a,b)=>a+b,0),pick=pool[0];

  let n=v==1?2:v<=3?3:v<=7?4:5;if(S.writ)n+=2;o.push({k:'sword',name:'基础舰装 (+0)',p:pr(Math.max(700,q*.4)),stock:n,bought:0});

function chibi(who,expr,cls,vb){const def={janus:'normal',pearl:'calm',akashi:'normal'}[who];const k=vb?'head':((EXMAP[who]||{})[expr||'idle']||def);
  return `<img class="chibi ${cls||''} ${vb?'headic':''}" src="${IMG[who+'_'+k]}" alt="" draggable="false">`}
const headVB='14 6 92 92';

const TIER=[0,3,6,10,15,20,30];
const tierOf=lv=>{let t=0;TIER.forEach((v,i)=>{if(lv>=v)t=i});return t};
const MAT=[['#7d8794','#4e5865'],['#9aa7b6','#5f6d7e'],['#cfe4ff','#6f97c8'],['#e6f2ff','#7fb8ea'],['#ffe9a8','#c99a2e'],['#fff4c4','#e0a820'],['#ffffff','#ffd77a']];
const KIND={citadel:'turret',holy:'sword',saw:'saw',dragon:'katana',rune:'cube',split:'torp',tree:'tree',fish:'fish',funerary:'anchor'};
function weaponSVG(w,big){if(w.scrap)return `<svg viewBox="0 0 64 56"><path d="M10 48 L20 30 L28 42 L38 24 L54 48Z" fill="#8a8170" stroke="#5a5040"/></svg>`;
  const p=w.peak||0,t=tierOf(p),f=w._fam||famOf(w)||(p>=6?['citadel','saw','rune'][w.lane]:null),k=f?KIND[f]:'gun',[m1,m2]=MAT[t],g='wg'+t+k+(big?'b':'');
  const gem=['#7fd0ff','#ff7ad9','#ffd77a','#9be27a'][(w.lane||0)%4];
  let s='';
  const defs=`<defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${m1}"/><stop offset="1" stop-color="${m2}"/></linearGradient>${t>=4?`<filter id="${g}f" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>`:''}</defs>`;
  const st=t>=4?'#8a5a10':'#2e3540';
  if(k=='gun')s=`<rect x="8" y="34" width="44" height="12" rx="4" fill="url(#${g})" stroke="${st}"/><rect x="16" y="24" width="24" height="13" rx="3" fill="url(#${g})" stroke="${st}"/><rect x="36" y="27" width="22" height="4" rx="2" fill="url(#${g})" stroke="${st}"/>${p>=4?`<rect x="36" y="33" width="20" height="4" rx="2" fill="url(#${g})" stroke="${st}"/>`:''}`;
  else if(k=='turret')s=`<path d="M6 46 Q8 26 30 24 Q48 24 52 40 L52 46Z" fill="url(#${g})" stroke="${st}"/>${[0,1,2].map(i=>`<rect x="40" y="${27+i*5}" width="${18+t}" height="3.4" rx="1.5" fill="url(#${g})" stroke="${st}" stroke-width=".7"/>`).join('')}<rect x="4" y="44" width="50" height="6" rx="2" fill="${m2}" stroke="${st}"/>`;
  else if(k=='sword')s=`<path d="M30 4 L35 10 L35 38 L25 38 L25 10Z" fill="url(#${g})" stroke="${st}"/><rect x="16" y="38" width="28" height="5" rx="2" fill="${t>=3?'#ffd77a':m2}" stroke="${st}"/><rect x="27" y="43" width="6" height="9" fill="#6b4a2a"/><circle cx="30" cy="54" r="2.6" fill="${t>=3?'#ffd77a':m2}"/><path d="M30 10 V34" stroke="#fff" stroke-width="1.2" opacity=".7"/>`;
  else if(k=='saw')s=`<circle cx="30" cy="28" r="18" fill="url(#${g})" stroke="${st}"/>${Array.from({length:12},(_,i)=>{const a=i*Math.PI/6;return `<path d="M${30+18*Math.cos(a)} ${28+18*Math.sin(a)} l${5*Math.cos(a+.6)} ${5*Math.sin(a+.6)} l${-3*Math.cos(a)} ${-3*Math.sin(a)}" fill="${m2}" stroke="${st}" stroke-width=".7"/>`}).join('')}<circle cx="30" cy="28" r="5" fill="${m2}" stroke="${st}"/>`;
  else if(k=='katana')s=`<path d="M8 50 Q30 40 56 8 Q40 36 14 54Z" fill="url(#${g})" stroke="${st}"/><rect x="4" y="48" width="12" height="5" rx="2" transform="rotate(-30 10 50)" fill="#a8304a"/><path d="M14 48 Q32 38 52 14" stroke="#fff" stroke-width="1" opacity=".7" fill="none"/>`;
  else if(k=='cube')s=`<path d="M30 6 L50 16 L50 38 L30 48 L10 38 L10 16Z" fill="url(#${g})" stroke="${st}"/><path d="M10 16 L30 26 L50 16 M30 26 V48" stroke="${st}" fill="none" opacity=".6"/><rect x="44" y="24" width="16" height="4" rx="2" fill="${m2}" stroke="${st}"/>`;
  else if(k=='torp')s=[0,1,2].map(i=>`<rect x="6" y="${16+i*10}" width="46" height="8" rx="4" fill="url(#${g})" stroke="${st}"/><path d="M52 ${17+i*10} l6 3 l-6 3z" fill="${m2}"/>`).join('');
  else if(k=='tree')s=`<path d="M28 54 L32 54 L33 30 L27 30Z" fill="#8a5a33"/><circle cx="30" cy="${p>=10?22:26}" r="${8+Math.min(10,p)}" fill="${p>=4?'#ffb7d5':'#7cc47a'}" stroke="${st}" opacity=".95"/>${p>=10?'<circle cx="22" cy="20" r="3" fill="#fff"/><circle cx="38" cy="26" r="3" fill="#fff"/>':''}`;
  else if(k=='fish')s=`<path d="M8 28 Q26 10 46 28 Q26 46 8 28Z" fill="url(#${g})" stroke="${st}"/><path d="M46 28 L58 18 L58 38Z" fill="${m2}" stroke="${st}"/><circle cx="16" cy="26" r="2" fill="#1a1030"/>`;
  else s=`<path d="M30 6 V44 M18 16 H42" stroke="url(#${g})" stroke-width="5" stroke-linecap="round"/><path d="M10 34 Q12 52 30 52 Q48 52 50 34" stroke="url(#${g})" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="30" cy="8" r="4" fill="none" stroke="${m2}" stroke-width="2.5"/>`;
  let deco='';
  if(t>=1)deco+=`<path d="M12 ${k=='sword'?44:40} h${k=='sword'?0:36}" stroke="${t>=4?'#fff6':'#fff4'}" stroke-width="1.5"/>`;
  if(t>=2)deco+=`<path d="M18 30 q4 -4 8 0 t8 0" stroke="${t>=4?'#a86a10':'#3b5f8f'}" stroke-width="1" fill="none" opacity=".8"/>`;
  if(t>=3)deco+=`<circle cx="22" cy="31" r="3.4" fill="${gem}" stroke="#fff" stroke-width="1"/><circle cx="21" cy="30" r="1" fill="#fff"/>`;
  const glow=t>=4?`<g filter="url(#${g}f)" opacity="${t>=5?.9:.6}">${s.replace(/url\(#[^)]+\)/g,t>=5?'#ffe680':'#bfe6ff')}</g>`:'';
  const halo=t>=5?`<ellipse cx="30" cy="28" rx="28" ry="24" fill="none" stroke="${t>=6?'#ff9bd2':'#ffd77a'}" stroke-width="1.6" stroke-dasharray="4 3" opacity=".9"><animateTransform attributeName="transform" type="rotate" from="0 30 28" to="360 30 28" dur="${t>=6?4:8}s" repeatCount="indefinite"/></ellipse>`:'';
  const parts=t>=6&&!LITE?[0,1,2,3].map(i=>`<circle r="1.6" fill="#fff"><animateMotion dur="${2+i*.5}s" repeatCount="indefinite" path="M${8+i*14} 50 Q${16+i*12} 20 ${10+i*14} 2"/><animate attributeName="opacity" values="0;1;0" dur="${2+i*.5}s" repeatCount="indefinite"/></circle>`).join(''):'';
  return `<svg viewBox="-4 -2 68 60">${defs}${halo}${glow}${s}${deco}${parts}</svg>`}

function tok(w,src,cls){return `<div class="tok ${cls||''} ${w.scrap?'scrap':''}" data-tok="${w.id}" data-src="${src}">${w.hot&&!w.scrap&&cls!='big'?'<span class="hot">🔥</span>':''}${w.ch&&!w.scrap&&cls!='mini'?`<span class="chg">⚡${w.ch}</span>`:''}${weaponSVG(w,cls=='big')}<span class="lv">${w.scrap?'残骸':'+'+w.lv}</span><span class="v">${valOf(w).toLocaleString()}</span></div>`}
function pearlExpr(tv,q){if(S.anger>=2)return 'sad';if(S.anger==1)return tv>=q?'idle':'surprise';return tv>=q?'joy':'calm'}
function janusExpr(){const w=cur();if(w&&inFr(w))return 'fire';if(reactCls=='joy')return 'joy';if(reactCls=='sad')return 'sad';return 'idle'}

   </div>

  h+=`<div class="info">`;
  if(w){const o=probs(w,fr||w.ch>=CHMAX);
    h+=`<b>${formName(w)}</b> <b style="color:#ffd77a">+${w.lv}</b>${famOf(w)?'<span class="tag">'+FAM[famOf(w)][0]+'</span>':''} · 价值 <b style="color:#ffd77a">${valOf(w).toLocaleString()}</b>${w.ch>=CHMAX&&!fr?' · <b style="color:#ff7ad9">下一锤开始狂热！</b>':''}

  h+=`</div><div class="tabs">${[['shop','明石的店'],['shelf','设备 '+S.relics.length+'/8'],['codex','图鉴'],['cal','日历']].map(([k,n])=>`<button class="btn ${S.tab==k?'on':''}" onclick="tab('${k}')">${n}</button>`).join('')}</div><div class="panel">${panel()}</div>
  <div style="text-align:center;margin-top:8px"><button class="btn sm" onclick="help()">📖 说明</button> <button class="btn sm" onclick="LITE=!LITE;M.lite=LITE;saveMeta();render()">${LITE?'🔋 省电：开':'✨ 特效：全开'}</button> <button class="btn sm" onclick="if(confirm('放弃当前进度重新开始？'))newRun()">重新开始</button></div>
  <div class="foot"><div class="in"><button class="btn" onclick="showTickets()">🎟️ 签数</button><button class="btn red" style="flex:1" onclick="bell()">🔔 打铃交订单（${tv.toLocaleString()} / ${q.toLocaleString()}）</button></div></div>`;
  document.getElementById('app').innerHTML=h;fxOverlay()}
// ----- 面板 -----
function relicIcon(k){const r=R[k],c=['#7fb8ea','#e0b44f','#ff7ad9'][r[2]];return `<svg viewBox="0 0 40 36"><path d="M20 2 L36 12 L30 34 L10 34 L4 12Z" fill="${c}" stroke="#fff" stroke-width="2"/><text x="20" y="25" font-size="13" text-anchor="middle" fill="#fff" font-weight="900">${r[0][0]}</text></svg>`}
const ITEMICON={scale:'🛡️',clock:'⏪',chalk:'🖍️',powder:'💥',shard:'✨',incense:'🍵',note:'📦'};
function panel(){
  if(S.tab=='shop'){let g='';
    const relics=S.shop.map((r,i)=>`<div class="good g${R[r.k][2]} ${r.sold?'sold':''}" onclick="goodRelic(${i})">${relicIcon(r.k)}<span class="nm">${R[r.k][0]}</span><span class="pr">${r.sold?'已兑换':S.gift?'免费':r.c+' 券'}</span></div>`).join('');
    g+=`<div class="shelf"><h4>${S.gift?'初始礼物：免费挑 1 个':'装备箱 · 用物资券兑换（概率 '+shopOdds(S.day).join('/')+'）'}</h4><div class="goods">${relics||'<small>明天开始营业</small>'}</div>${!S.gift&&S.shop.length?`<button class="btn sm" style="margin-top:5px" onclick="reroll()">🔄 刷新 ${has('worn_voucher')&&!S.freeRr?'免费':rerollCost().toLocaleString()+' 资金'}</button>`:''}</div>`;
    g+=`<div class="shelf"><h4>明石的货架 · 用资金购买${S.merch?'（重复购买 ×3 价）':''}</h4><div class="goods">${S.merch?S.merch.map((it,i)=>`<div class="good ${it.bought>=it.stock?'sold':''}" onclick="goodMerch(${i})">${it.k=='sword'?weaponSVG(newSwordPreview()):it.k=='special'?weaponSVG({peak:it.lv,lv:it.lv,line:it.line,lane:0}):`<div style="font-size:22px;height:30px">${ITEMICON[it.k]}</div>`}<span class="nm">${it.name}</span><span class="pr">${it.bought>=it.stock?'售罄':(it.p*Math.pow(3,it.bought)).toLocaleString()}</span></div>`).join(''):`<small>明石去进货了喵~ 第 3、6、9…天开张。下次：第 ${Math.ceil((S.day+1)/3)*3} 天</small>`}</div></div>`;
    return `<div class="store">${chibi('akashi',S.merch?'joy':'idle','akashi')}<div class="desk"><span>明石的柜台</span></div><div class="shelves">${g}</div></div>`}
  if(S.tab=='shelf')return (S.relics.length?S.relics.map(k=>rel(k,`<button class="btn sm" onclick="drop('${k}')">丢弃</button>`)).join(''):'<small>还没有设备</small>')+
    `<small>本局：缴足 ${S.paid} 次 · 失望 ${S.fails} 次 · 打碎 ${S.broken} 件 · 狂热 ${S.frenzies} 次${S.grudge?' · 怨念大成功签 '+S.grudge:''}</small>`;
  if(S.tab=='codex'){let h='<b>武器外观（等级段 +0/3/6/10/15/20/30）</b>';
    for(const f in FAM){const m=M.forms[f]??-1;const lv0=MERCH_LINES.includes(f)?0:10;
      h+=`<div class="relic" style="display:block"><b>${FAM[f][0]}</b> <small>最高 +${m<0?'—':m}</small><div class="wtab">${TIER.map(lv=>{const pw={peak:lv,lv,line:MERCH_LINES.includes(f)?f:null,lane:0,branch:0};const ok=m>=lv||(m>=0&&lv<lv0);return `<div class="${ok?'':'sil'}">${weaponSVG(f in KIND&&!pw.line?Object.assign(pw,{_fam:f}):pw)}+${lv}</div>`}).join('')}</div><small>${FAM[f].slice(1).map((n,i)=>m>=lv0+i*2?n:'???').join(' → ')}</small></div>`}
    h+='<b>成就</b>';for(const k in ACH)h+=`<div class="relic"><div><b>${M.ach[k]?'🏆 ':'🔒 '}${ACH[k][0]}</b><br>${ACH[k][1]}</div></div>`;
    return h+`<small>累计 ${M.runs} 局，历史最高单件 ${M.best.toLocaleString()}</small>`}
  if(S.tab=='cal'){let h='<div class="cal">';for(let d=1;d<=Math.max(21,S.day+3);d++)h+=`<div class="${d==S.day?'now':''} ${d<S.day?'past':''}">${d}${isMerchDay(d)?chibi('akashi','idle','',headVB):''}${quotaOf(d)>=1e4?Math.round(quotaOf(d)/1000)+'k':quotaOf(d)}</div>`;
    return h+'</div><small>有明石小头像的日子 = 明石来访。第 21 天后进入延长期，订单每天 +20%。</small>'}}
function rel(k,btn){const r=R[k];return `<div class="relic r${r[2]}"><div style="width:30px;flex:none">${relicIcon(k)}</div><div style="flex:1"><b>${r[0]}</b><span class="tag">${['普通','稀有','传说'][r[2]]}${r[5]=='m'?'·杰作':r[5]=='a'?'·成就':''}</span><br>${r[1]}</div>${btn||''}</div>`}
function newSwordPreview(){return {peak:0,lv:0,lane:0}}
function goodRelic(i){const r=S.shop[i];if(r.sold)return;const R0=R[r.k];modal(R0[0],`<div class="por">${chibi('akashi','idle')}</div>${rel(r.k)}<br>价格：<b>${S.gift?'免费':r.c+' 张物资券'}</b>（你有 ${S.cred} 张）<br><small>明石：「这个可是好东西喵~」</small>`,S.gift?'就要这个！':'兑换',()=>buyRelic(i),'再看看')}
function goodMerch(i){const it=S.merch[i];if(it.bought>=it.stock)return;const p=it.p*Math.pow(3,it.bought);modal(it.name,`<div class="por">${chibi('akashi','joy')}</div>${ITEMS[it.k]?ITEMS[it.k][1]:it.k=='special'?'明石的专属系列：基础价值是普通舰装的 2 倍，每 2 级换一种外形。':'普通的 +0 舰装，买来直接放上库存架。'}<br><br>价格：<b>${p.toLocaleString()}</b> 资金（你有 ${S.gold.toLocaleString()}）· 剩 ${it.stock-it.bought}`,'购买',()=>buyM(i),'再看看')}
function modal(t,body,btn,cb,cancel){const m=document.createElement('div');m.className='modal';const pearl=/珍珠号/.test(t+body)&&!/class="por"/.test(body)?`<div class="por">${chibi('pearl',/失望 3|取消|还不够|眼泪/.test(body)?'sad':'joy')}</div>`:'';
  m.innerHTML=`<div class="box">${pearl}<h2>${t}</h2>${body}<div style="clear:both"></div><br><div class="row"><button class="btn gold" style="flex:1">${btn}</button>${cancel?`<button class="btn">${cancel}</button>`:''}</div></div>`;document.body.appendChild(m);
  const bs=m.querySelectorAll('button');bs[0].onclick=()=>{m.remove();cb&&cb()};if(bs[1])bs[1].onclick=()=>m.remove()}
const PEARL_LINES=['今天也在等指挥官的作品哦~','这些舰装……像小小的月亮一样闪闪发光呢。','不着急，慢慢来，我会一直在这里等你~','偷偷告诉你，我会把喜欢的舰装放在收藏台的正中间~'];
function pearlTalk(){const l=S.anger>=2?'……这次，请不要再让我哭了哦。':S.anger==1?'上次……没关系的，我相信指挥官。':pick1(PEARL_LINES);toast('珍珠号：'+l)}
// ----- 签数面板 -----
function showTickets(){let w=cur(),note='砧台上的舰装';if(!w){w=rackItems().find(x=>!x.scrap);note='库存架第一件舰装（还没放上砧台）'}if(!w){w=newSword();S.uid--;note='一件新的 +0 舰装（示例）'}
  const fr=inFr(w)||w.ch>=CHMAX,log=[],t=deck(w,fr,log),p=probs(w,fr),c=curve(w.lv),bw=c>=1?1e9:(21*c/(1-c))*t.B/9;
  const rows='GSHDB'.split('').map(k=>`<tr><td><span style="color:${COL[k]};font-weight:800">${NM[k]}</span></td><td>${k=='B'?t.B+' 张<br><small>按 +'+w.lv+' 加权 '+(fr?'—':bw.toFixed(1))+'</small>':t[k]+' 张'}</td><td>${Math.round(p[k]*1000)}</td><td><b>${(p[k]*100).toFixed(1)}%</b></td></tr>`).join('');
  const mods=log.map(([why,d])=>`<li>${why}：${Object.entries(d).map(([k,n])=>NM[k]+(n>0&&log[0][1]!==d?'+':'')+n).join('，')}</li>`).join('');
  const bm=[];if(has('black_knot'))bm.push('黑色舰绳结 ×0.9');if(has('dragonscale_tongs')&&w.lv>=6)bm.push('龙鳞铁钳 ×0.75');if(w.scorch)bm.push('焦黑护符 ×'+(1-.03*w.scorch).toFixed(2));if(w.splice)bm.push('裂开的接驳件 ×'+(1-.15*w.splice).toFixed(2));if(w.nextBk!=1)bm.push('下一锤减免 ×'+w.nextBk.toFixed(2));
  modal('🎟️ 签池明细',`<b>${formName(w)} +${w.lv}</b> <small>（${note}）</small>${fr?'<br><b style="color:#d0359f">狂热中/即将狂热：破碎签全部清空</b>':''}${S.armed.powder&&!fr?'<br><b>高爆火药包已就绪：成功/大成功→大成功，其余→破碎</b>':''}
  <table class="tk"><tr><th>结果</th><th>签池</th><th>/1000</th><th>概率</th></tr>${rows}</table>
  <small>破碎签的权重随等级变化：基础牌堆上 +${w.lv} 的破碎率为 ${(c*100).toFixed(1)}%，其他四种按签数分剩下的部分，最后取整到 1000 张。</small>
  <br><b>签池来源</b><ul style="margin:4px 0;padding-left:18px">${mods}</ul>${bm.length?'<b>破碎概率倍率</b>：'+bm.join('，'):''}`,'知道了')}
// ----- 拖拽 -----
let drag=null;
function validDrop(w,src,dst){if(!w)return false;switch(dst){
  case 'rack':return src!=='rack';case 'furnace':return !w.scrap&&!w.hot&&!S.heating;
  case 'anvil':return !w.scrap&&w.hot&&src!=='anvil';case 'box':return !w.scrap;case 'window':return !w.tr&&src!=='window'}return false}
function zoneAt(x,y){const els=document.elementsFromPoint(x,y);for(const e of els){const z=e.closest&&e.closest('[data-drop]');if(z)return z}return null}
document.addEventListener('pointerdown',e=>{const t=e.target.closest('[data-tok]');
  if(!t){const a=e.target.closest('[data-tap="anvil"]');if(a&&cur()){e.preventDefault();strike()}return}
  e.preventDefault();drag={id:+t.dataset.tok,src:t.dataset.src,x0:e.clientX,y0:e.clientY,el:t,moved:false,ghost:null,zone:null}});
document.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x0,dy=e.clientY-drag.y0;
  if(!drag.moved){if(Math.hypot(dx,dy)<7)return;drag.moved=true;const r=drag.el.getBoundingClientRect();const g=drag.el.cloneNode(true);g.classList.add('ghost');g.style.left=r.left+'px';g.style.top=r.top+'px';g.style.width=r.width+'px';g.style.height=r.height+'px';document.body.appendChild(g);drag.ghost=g;drag.r=r;drag.el.style.opacity=.3;
    document.body.classList.add('dragging');const w=S.inv.find(x=>x.id===drag.id);document.querySelectorAll('[data-drop]').forEach(z=>z.classList.add(validDrop(w,drag.src,z.dataset.drop)?'ok':'no'))}
  drag.ghost.style.left=drag.r.left+dx+'px';drag.ghost.style.top=drag.r.top+dy+'px';
  const z=zoneAt(e.clientX,e.clientY);if(z!==drag.zone){drag.zone&&drag.zone.classList.remove('hover');z&&z.classList.add('hover');drag.zone=z}},{passive:true});
function endDrag(e,cancel){if(!drag)return;const d=drag;drag=null;document.body.classList.remove('dragging');document.querySelectorAll('[data-drop]').forEach(z=>z.classList.remove('ok','no','hover'));
  if(!d.moved){if(cancel)return;const w=S.inv.find(x=>x.id===d.id);if(d.src==='anvil')return strike();if(w)toast(`${formName(w)} ${w.scrap?'':'+'+w.lv} · 价值 ${valOf(w).toLocaleString()}${w.scrap?'':w.hot?' · 已加热':' · 未加热'}`);return}
  const z=cancel?null:zoneAt(e.clientX,e.clientY),w=S.inv.find(x=>x.id===d.id),dst=z&&z.dataset.drop;
  if(dst&&validDrop(w,d.src,dst)){d.ghost.remove();dropTo(w,d.src,dst)}
  else{if(dst=='anvil'&&w&&!w.hot)toast('要先拖进火炉加热哦');else if(dst=='furnace'&&w&&w.hot)toast('这件已经热好了');
    const g=d.ghost;g.classList.add('back');g.style.left=d.r.left+'px';g.style.top=d.r.top+'px';setTimeout(()=>{g.remove();d.el.style.opacity=''},260)}}
document.addEventListener('pointerup',e=>endDrag(e,false));document.addEventListener('pointercancel',e=>endDrag(e,true));
function dropTo(w,src,dst){if(src==='anvil'){S.sel=-1;S.fr=null;undoSnap=null;procs=[]}if(src==='window')w.tr=false;
  if(dst=='furnace'){S.heating={id:w.id};snd('heat');say('加热中……呼，好烫。');setTimeout(()=>{w.hot=true;S.heating=null;say('热好了！把它拖到砧台上吧。');save();render()},1600)}
  else if(dst=='anvil'){if(S.sel!==-1){S.fr=null}S.sel=w.id;w.tr=false;undoSnap=null;procs=[];snd('hold');say('准备好了，点砧台就能敲！')}
  else if(dst=='box'){save();render();return feed(w.id)}
  else if(dst=='window'){w.tr=true;snd('buy');say('交给珍珠号保管啦~')}
  else snd('hold');
  save();render()}
// ----- 狂热特效 -----
let fxRaf=0;
function fxOverlay(){document.querySelectorAll('.frfx,.combo,.closeup').forEach(e=>e.remove());const w=cur();if(!w||!inFr(w))return;
  const o=document.createElement('div');o.className='frfx'+(LITE?' lite':'');document.body.appendChild(o);
  const c=document.createElement('div');c.className='combo pop';c.innerHTML=(S.combo||0)+' 连击<small>狂热中 · 不会破碎！</small>';document.body.appendChild(c);
  const cu=document.createElement('div');cu.className='closeup';cu.innerHTML=chibi('janus','fire');document.body.appendChild(cu);
  if(!fxRaf)fxRaf=requestAnimationFrame(fxLoop)}
function fxLoop(){fxRaf=0;if(!S.fr)return;const left=S.fr.end-now(),r=document.getElementById('ringc');if(r){r.style.strokeDashoffset=415*(1-Math.max(0,left)/frDur());r.style.stroke=left<1200?'#ff4d6d':'#ff7ad9'}if(left>0)fxRaf=requestAnimationFrame(fxLoop)}
function burst(n){const a=document.querySelector('.anvil');if(!a)return;const b=document.createElement('div');b.className='burst';
  for(let i=0;i<(LITE?Math.min(4,n):n);i++){const ang=Math.random()*Math.PI*2,d=20+Math.random()*40;b.innerHTML+=`<i style="--dx:${Math.cos(ang)*d}px;--dy:${Math.sin(ang)*d-10}px"></i>`}a.appendChild(b);setTimeout(()=>b.remove(),500)}
const _strike=strike;
strike=function(){const w=cur();if(!w)return;const t0=tierOf(w.peak),wasFr=inFr(w),c0=w.n,id=w.id;_strike();const w2=S.inv.find(x=>x.id===id);
  if(!w2||w2.n===c0){if(!w2)S.combo=0;return}
  const fr=inFr(w2);if(fr&&!wasFr)S.combo=0;if(fr){S.combo=(S.combo||0)+1;PITCH=Math.min(2,1+S.combo*.06)}else PITCH=1;
  const hm=document.querySelector('.hammer');if(hm){hm.classList.add('hit');setTimeout(()=>hm.classList.remove('hit'),110)}
  burst(fr?14:6);if(fr&&!LITE){const app=document.getElementById('app');app.classList.remove('quake');void app.offsetWidth;app.classList.add('quake')}
  if(tierOf(w2.peak)>t0){const a=document.querySelector('.onanvil');if(a){const e=document.createElement('div');e.className='evo';a.appendChild(e)}fx('✨ 外观进化！','#ffd77a');snd('great')}
  if(fr&&S.combo%5==0)toast('雅努斯：'+pick1(['好、好厉害……继续！','嘿嘿~手感正好！','就是现在，指挥官！']))}
let PITCH=1;

loadMeta();LITE=!!M.lite||matchMedia('(prefers-reduced-motion: reduce)').matches;load();S.heating=null;render();if(!localStorage.getItem('ftal_seen')){localStorage.setItem('ftal_seen',1);help()}
